<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041F17"/>
      <stop offset="50%" stop-color="#063226"/>
      <stop offset="100%" stop-color="#02140F"/>
    </linearGradient>

    <!-- Eco Terra Gradient -->
    <linearGradient id="terraGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Fuse Firewall Gradient -->
    <linearGradient id="fuseGrad" x1="0%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect x="2" y="2" width="176" height="176" rx="42" fill="url(#bgGrad)" stroke="#10B981" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Subtle Shield Perimeter Arc -->
  <path d="M42 54C42 42 66 34 90 34C114 34 138 42 138 54V98C138 126 112 144 90 152C68 144 42 126 42 98V54Z" 
        stroke="url(#fuseGrad)" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="4 4" fill="none"/>

  <!-- Left / Lower Leaf & Circular Loop (Terra) -->
  <path d="M90 42C64 42 48 64 48 90C48 116 68 134 90 134C108 134 122 122 124 104C125 94 116 86 106 86C96 86 88 94 88 104C88 110 82 116 74 114C64 111 58 102 58 90C58 72 72 58 90 58C108 58 122 72 122 90" 
        stroke="url(#terraGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Right / Upper Protective Interlock (Fuse & Shield) -->
  <path d="M90 42C116 42 132 64 132 90C132 116 114 134 90 134" 
        stroke="url(#fuseGrad)" stroke-width="11" stroke-linecap="round"/>

  <!-- Organic Central Vein / Spark Node -->
  <path d="M74 106L106 74" stroke="#6EE7B7" stroke-width="7" stroke-linecap="round"/>

  <!-- Central Decision Fusion Core -->
  <circle cx="90" cy="90" r="7.5" fill="#F0FDF4" stroke="#10B981" stroke-width="3"/>
  <circle cx="90" cy="90" r="3" fill="#047857"/>
</svg>
